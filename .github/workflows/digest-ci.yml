name: Digest CI

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate digest.csv header
        run: |
          expected="ticker,avg_close,max_close,min_close,pct_change"
          actual="$(head -n 1 digest.csv)"
          echo "Expected header: $expected"
          echo "Actual header:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::digest.csv header mismatch"
            exit 1
          fi
